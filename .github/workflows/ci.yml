name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      # The runner image ships a setuptools with a known vulnerability (PYSEC-2026-3447); pip-audit sees it.
      - run: pip install --upgrade "setuptools>=83" && pip install -e "api[dev]"
      - name: Commit-stage hooks (hygiene, ruff, mypy, architecture, docs sync, shellcheck)
        # The ui hook needs Node and node_modules: the ui job runs it.
        env:
          SKIP: ui
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Tests with branch coverage (threshold in api/pyproject.toml)
        env:
          SKIP: ui
        run: pre-commit run --all-files --hook-stage pre-push --show-diff-on-failure
      - name: Known vulnerabilities in dependencies
        run: cd api && pip-audit --skip-editable

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        run: cd ui && npm ci
      - name: Generated API types are current
        run: cd ui && npm run check:api
      - name: Biome, strict TypeScript and tests
        run: cd ui && npm run check
      - name: Build
        run: cd ui && npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: pip install -e "api[dev]"
      - name: Build images
        run: |
          docker build -f api/Dockerfile -t pn-llm-verif/api:ci .
          docker build -f engines/dummy/Dockerfile -t pn-llm-verif/dummy:latest .
      - name: Integration tests against the real dummy engine image
        run: cd api && pytest -q -m docker
