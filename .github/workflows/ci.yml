name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: pip install -e "api[dev]"
      - name: Commit-stage hooks (hygiene, ruff, mypy, architecture, docs sync, shellcheck)
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Tests with branch coverage (threshold in api/pyproject.toml)
        run: pre-commit run --all-files --hook-stage pre-push --show-diff-on-failure
      - name: Known vulnerabilities in dependencies
        run: cd api && pip-audit --skip-editable

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: pip install -e "api[dev]"
      - name: Build images
        run: |
          docker build -t pn-llm-verif/api:ci api
          docker build -t pn-llm-verif/dummy:latest engines/dummy
      - name: Integration tests against the real dummy engine image
        run: cd api && pytest -q -m docker
