name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      # The locked set (hashes included) is what runs here, in the image and on a developer's machine.
      - run: |
          pip install --require-hashes -r api/requirements-dev.txt
          pip install --no-deps --no-build-isolation -e api
      - name: Commit-stage hooks (hygiene, ruff, mypy, architecture, docs sync, shellcheck)
        # The ui hook needs Node and node_modules: the ui job runs it.
        env:
          SKIP: ui
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Tests with branch coverage (threshold in api/pyproject.toml)
        run: cd api && pytest -q --cov=app --cov-branch --cov-report=term-missing --cov-report=xml --cov-report=html
      - name: Coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            api/coverage.xml
            api/htmlcov
      - name: Known vulnerabilities in dependencies
        run: cd api && pip-audit --require-hashes -r requirements-dev.txt

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        run: cd ui && npm ci
      - name: Generated API types are current
        run: cd ui && npm run check:api
      - name: Biome, strict TypeScript and tests
        run: cd ui && npm run check
      - name: Build
        run: cd ui && npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: |
          pip install --require-hashes -r api/requirements-dev.txt
          pip install --no-deps --no-build-isolation -e api
      - name: Build images
        run: |
          docker build -f api/Dockerfile -t pn-llm-verif/api:ci .
          docker build -f engines/dummy/Dockerfile -t pn-llm-verif/dummy:latest .
          # Every engine image: the template and the shared kit are not engines.
          for dockerfile in engines/*/Dockerfile; do
            name="$(basename "$(dirname "$dockerfile")")"
            case "$name" in dummy|template|common) continue ;; esac
            docker build -f "$dockerfile" -t "pn-llm-verif/$name:ci" .
          done
      - name: Integration tests against the real dummy engine image
        run: cd api && pytest -q -m docker
