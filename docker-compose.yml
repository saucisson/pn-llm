# Local prototype (WSL2). Engine images are built here but launched on demand by the API
# (ephemeral docker run), not as permanent services.
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports: ["8000:8000"]
    environment:
      PNVERIF_DATABASE_PATH: /data/pnverif.sqlite
    volumes:
      - pnverif-data:/data   # persistent storage (SQLite)
      # WARNING: gives the API near-root access to the host. Acceptable locally only.
      - /var/run/docker.sock:/var/run/docker.sock

  # Profile "workers": run jobs in a separate process (set PNVERIF_EMBEDDED_WORKERS=0 on the api).
  worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["python", "-m", "app.main"]
    environment:
      PNVERIF_DATABASE_PATH: /data/pnverif.sqlite
    volumes:
      - pnverif-data:/data
      # WARNING: gives the worker near-root access to the host. Acceptable locally only.
      - /var/run/docker.sock:/var/run/docker.sock
    profiles: ["workers"]

  # Profile "engines": docker compose --profile engines build
  engine-dummy:
    build:
      context: .
      dockerfile: engines/dummy/Dockerfile
    image: pn-llm-verif/dummy:latest
    profiles: ["engines"]

  engine-native:
    build:
      context: .
      dockerfile: engines/native/Dockerfile
    image: pn-llm-verif/native:1.2
    profiles: ["engines"]

  engine-itstools:
    build:
      context: .
      dockerfile: engines/itstools/Dockerfile
    image: pn-llm-verif/itstools:1.0.0.202609112134
    profiles: ["engines"]

  engine-tapaal:
    build:
      context: .
      dockerfile: engines/tapaal/Dockerfile
    image: pn-llm-verif/tapaal:4.4.2
    profiles: ["engines"]

volumes:
  pnverif-data:
